<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tareas</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="./manifest.json">
</head>
<body>
<header class="top">
  <h1>Gestor de Tareas Anthony</h1>
  <div class="api-box">
    <label for="modo">Datos</label>
    <select id="modo">
      <option value="local">Modo local (sin API, se guarda en tu navegador)</option>
      <option value="api">Conectar a mi API</option>
    </select>
    <input id="apiUrl" type="text" value="https://localhost:5001/api/tareas" hidden>
    <button id="btnGuardarUrl" class="btn ghost" hidden>Guardar</button>
  </div>
</header>

<main class="layout">
  <section class="panel">
    <h2 id="formTitulo">Nueva tarea</h2>
    <form id="form">
      <input type="hidden" id="tareaId">
      <label for="titulo">Título</label>
      <input id="titulo" required maxlength="100" placeholder="Ej. Entregar reporte">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" rows="3" placeholder="Detalles opcionales"></textarea>
      <label for="prioridad">Prioridad</label>
      <select id="prioridad">
        <option value="Baja">Baja</option>
        <option value="Media" selected>Media</option>
        <option value="Alta">Alta</option>
      </select>
      <div class="row">
        <button type="submit" class="btn primary" id="btnGuardar">Crear tarea</button>
        <button type="button" class="btn ghost" id="btnCancelar" hidden>Cancelar</button>
      </div>
    </form>

    <h2>Buscar por ID</h2>
    <div class="row">
      <input id="buscarId" type="number" min="1" placeholder="ID">
      <button class="btn blue" id="btnBuscar">Buscar</button>
    </div>
    <div id="resultadoId" class="resultado"></div>
  </section>

  <section class="lista">
    <div class="toolbar">
      <div class="filtros" id="filtros">
        <button class="chip activo" data-f="todas">Todas</button>
        <button class="chip" data-f="pendientes">Pendientes</button>
        <button class="chip" data-f="completadas">Completadas</button>
      </div>
      <button class="btn blue" id="btnRecargar">Recargar</button>
    </div>
    <p id="contador" class="contador"></p>
    <div id="tareas" class="grid"></div>
  </section>
</main>



<div id="toast" class="toast" role="status"></div>

<script>
//definimos un atajo 
const $ = id => document.getElementById(id);
let modo = localStorage.getItem('modo') || 'local';
let API = localStorage.getItem('apiUrl') || $('apiUrl').value;
let tareas = [], filtro = 'todas';

//se sincronizan los controles de la pagina con los valores guardados en localStorage
$('modo').value = modo; $('apiUrl').value = API;
mostrarModo();

//muiestra y oculta el campo de url y su boton de guardar, si el modo es local quedan ocultos porque no se necesita servidor
function mostrarModo() {
  $('apiUrl').hidden = $('btnGuardarUrl').hidden = modo !== 'api';
}

//API LOCAL

//llama a una funcion con la misma forma que un endpoint  REST, guardandose los datos en el localStorage del navegador, para poder usar la app sin necesidad de un servidor
const DB = {
  leer() { try { return JSON.parse(localStorage.getItem('tareasDB')) || []; } catch (e) { return []; } },
  guardar(l) { localStorage.setItem('tareasDB', JSON.stringify(l)); }
};

//simula una peticion a la api usando localstorage
//metod: (get, post, put, patch, delete), id: (identificador de la tarea), 
//accion: (es reservado para rutas), body: datos de la tarea para post y put
function apiLocal(method, id, accion, body) {
  //carga la lista de tareas guardadas
  const l = DB.leer();
  //busca la posicion de la tarea con ese id (-1 si no existe)
  //se usa  ==  para que 3 (texto) y 3 (numerp) coincidan
  const i = l.findIndex(t => t.id == id);
  if (method === 'GET' && !id) return l;                                 
  if (method === 'GET') { if (i < 0) throw new Error('404'); return l[i]; } 
  if (method === 'POST') {    
    //copia los datos recibiidos y les asigna un id nuevo
    //el id mas grande existente en + 1 empieza en 0 si la lista est vacia.                                            
    const nueva = { ...body, id: l.reduce((m, t) => Math.max(m, t.id), 0) + 1 };
    //agrega la tarea a la lusta, guardada y devuelve la tarea creada 
    l.push(nueva); DB.guardar(l); return nueva;
  }
  if (i < 0) throw new Error('404');
  if (method === 'PUT') l[i] = { ...body, id: l[i].id };                  
  if (method === 'PATCH') l[i].completada = true;                          
  if (method === 'DELETE') l.splice(i, 1);   
  //guarda los cambios en el localstorage y devuelve los nulos                               
  DB.guardar(l); return null;
}

//hace la peticion: en modo local usa la apilocal arma la url y llama al servidor con el fetch
async function api(method, id, accion, body) {
  if (modo === 'local') return apiLocal(method, id, accion, body);
  const url = API + (id ? '/' + id : '') + (accion ? '/' + accion : '');
  const opts = { method };
  if (body) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error('Error ' + r.status);
  return r.status === 204 ? null : r.json().catch(() => null);
}
//muestra un mensaje temporal de 3s si error es true, se ve en estilo de error
function toast(msg, error) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (error ? ' error' : '');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.className = 'toast', 3000);
}

//pide todas las tareas a la api, y si falla avisa al toast del errooe
async function cargar() {
  try { tareas = await api('GET'); render(); }
  catch (e) { toast('No se pudo conectar con la API. Revisa la URL y el CORS.', true); }
}
//guarda el formularios si hay id actualiza la tarea (PUT), si no la crea (POST)

async function buscar() {
  const id = $('buscarId').value;
  if (!id) return;
  try {
    const t = await api('GET', id);
    $('resultadoId').innerHTML = `<strong>#${t.id} ${esc(t.titulo)}</strong><br>${esc(t.descripcion || 'Sin descripción')}<br>Prioridad: ${t.prioridad} · ${t.completada ? 'Completada' : 'Pendiente'}`;
  } catch (e) { $('resultadoId').textContent = 'No se encontró la tarea ' + id; }
}

//guarda el formulario si hay id actualiza la tarea (PUT), si no la crea (POST)

async function guardar(ev) {
  ev.preventDefault();
  const id = $('tareaId').value;
  const actual = tareas.find(t => t.id == id);
  const data = { titulo: $('titulo').value.trim(), descripcion: $('descripcion').value.trim(), prioridad: $('prioridad').value, completada: actual ? actual.completada : false };
  try {
    if (id) { await api('PUT', id, null, { ...data, id: +id }); toast('Tarea actualizada'); }
    else { await api('POST', null, null, data); toast('Tarea creada'); }
    limpiar(); cargar();
  } catch (e) { toast('No se pudo guardar la tarea', true); }
}
//marca una tarea como completada (PATCH) y recarga la lista

async function completar(id) {
  try { await api('PATCH', id, 'completar'); toast('Tarea completada'); cargar(); }
  catch (e) { toast('No se pudo completar la tarea', true); }
}

//elimina una tarea (DELETE) después de pedir confirmación y recarga la lista

async function eliminar(id) {
  if (!confirm('¿Eliminar esta tarea?')) return;
  try { await api('DELETE', id); toast('Tarea eliminada'); cargar(); }
  catch (e) { toast('No se pudo eliminar la tarea', true); }
}
// Pasa los datos de una tarea al formulario y lo pone en modo edición
function editar(id) {
  const t = tareas.find(x => x.id == id);
  $('tareaId').value = t.id; $('titulo').value = t.titulo;
  $('descripcion').value = t.descripcion || ''; $('prioridad').value = t.prioridad;
  $('formTitulo').textContent = 'Editar tarea #' + t.id;
  $('btnGuardar').textContent = 'Guardar cambios'; $('btnCancelar').hidden = false;
  $('titulo').focus(); scrollTo({ top: 0, behavior: 'smooth' });
}
//vacia el formulario y lo regresa al modo "Nueva tarea"

function limpiar() {
  $('form').reset(); $('tareaId').value = '';
  $('formTitulo').textContent = 'Nueva tarea'; $('btnGuardar').textContent = 'Crear tarea'; $('btnCancelar').hidden = true;
}
//escapa caracteres especiales del texto (&, <, >, comillas) para evitar que se inyecte HTML

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
//filtra las tareas según el filtro activo y dibuja las tarjetas (o un mensaje si no hay ninguna)

function render() {
  const lista = tareas.filter(t => filtro === 'todas' || (filtro === 'completadas') === !!t.completada);
  $('contador').textContent = `${lista.length} de ${tareas.length} tareas`;
  $('tareas').innerHTML = lista.length ? lista.map(t => `
    <article class="card ${t.prioridad.toLowerCase()} ${t.completada ? 'hecha' : ''}">
      <span class="badge">${t.prioridad}</span>
      <h3>#${t.id} ${esc(t.titulo)}</h3>
      <p>${esc(t.descripcion || 'Sin descripción')}</p>
      <div class="acciones">
        ${t.completada ? '<span class="ok">Completada</span>' : `<button class="btn green sm" onclick="completar(${t.id})">Completar</button>`}
        <button class="btn blue sm" onclick="editar(${t.id})">Editar</button>
        <button class="btn red sm" onclick="eliminar(${t.id})">Eliminar</button>
      </div>
    </article>`).join('') : '<p class="vacio">No hay tareas aquí. Crea la primera con el formulario.</p>';
}

//conecta los botones y controles de la página con sus funciones

$('form').addEventListener('submit', guardar);
$('btnCancelar').onclick = limpiar;
$('btnBuscar').onclick = buscar;
$('btnRecargar').onclick = cargar;
//conecta los botones y controles de la página con sus funciones
$('modo').onchange = () => { modo = $('modo').value; localStorage.setItem('modo', modo); mostrarModo(); cargar(); };
//guarda la URL de la API (sin "/" final) y recarga las tareas
$('btnGuardarUrl').onclick = () => { API = $('apiUrl').value.trim().replace(/\/$/, ''); localStorage.setItem('apiUrl', API); toast('URL guardada'); cargar(); };
//cambia el filtro (todas / completadas / pendientes), marca el botón activo y vuelve a pintar
$('filtros').onclick = e => {
  if (!e.target.dataset.f) return;
  filtro = e.target.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('activo', c === e.target));
  render();
};

// Datos de ejemplo la primera vez que se abre en modo local
if (modo === 'local' && !localStorage.getItem('tareasDB')) {
  DB.guardar([
    { id: 1, titulo: 'Probar el gestor de tareas', descripcion: 'Crea, edita, completa y elimina tareas.', prioridad: 'Alta', completada: false },
    { id: 2, titulo: 'Subir los archivos a Hostinger', descripcion: 'index.html y styles.css en public_html.', prioridad: 'Media', completada: false }
  ]);

}
//carga y miestra las tareas al abrir la página

cargar();
</script>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((registration) => {
        console.log('Service Worker registrado:', registration.scope);
      })
      .catch((error) => {
        console.error('Error al registrar Service Worker:', error);
      });
  });
}
</script>
</body>
</html>
